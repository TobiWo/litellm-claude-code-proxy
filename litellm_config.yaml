litellm_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  ssl_verify: false
  additional_drop_params: ["response_format"]
general_settings:
  allow_requests_on_db_unavailable: true
model_list:
  - model_name: claude-opus-4-7*
    litellm_params:
      model: github_copilot/claude-opus-4.7
  - model_name: claude-opus-4-6*
    litellm_params:
      model: github_copilot/claude-opus-4.6
  - model_name: claude-sonnet-4-6*
    litellm_params:
      model: github_copilot/claude-sonnet-4.6
  - model_name: claude-haiku-4-5*
    litellm_params:
      model: github_copilot/claude-haiku-4.5
  - model_name: github_copilot/gpt-5.3-codex
    litellm_params:
      model: github_copilot/gpt-5.3-codex
  - model_name: github_copilot/gpt-5-mini
    litellm_params:
      model: github_copilot/gpt-5-mini
  - model_name: github_copilot/gpt-4.1
    litellm_params:
      model: github_copilot/gpt-4.1
